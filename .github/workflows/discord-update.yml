# Posts new version history entries to Discord once GitHub Pages has
# deployed them, so the link in the post always opens the live page.
# Setup and how it works: README, "Discord update feed".
name: Discord update feed

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re)post, for example 2.5.0"
        required: true
      dry_run:
        description: "Only show the message in the log, don't post it"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

# One at a time, so two quick pushes can't post the same entry twice.
concurrency:
  group: discord-update
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Compare with the commit the previous successful deploy published,
      # not just the parent commit: a push can hold several commits.
      - name: Find the previously deployed commit
        if: github.event_name == 'workflow_run'
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CREATED: ${{ github.event.workflow_run.created_at }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID/runs?status=success&branch=main&per_page=30" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID and .created_at < \"$CREATED\")][0].head_sha // empty")
          echo "Previously deployed: ${sha:-none found}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Post new entries
        if: github.event_name == 'workflow_run'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_ROLE_ID }}
        run: python .github/scripts/discord_update.py --before "${{ steps.prev.outputs.sha }}" --after HEAD

      - name: Post one version (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_ROLE_ID }}
          VERSION: ${{ inputs.version }}
        run: python .github/scripts/discord_update.py --version "$VERSION" ${{ inputs.dry_run && '--dry-run' || '' }}
